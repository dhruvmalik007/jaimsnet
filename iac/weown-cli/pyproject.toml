[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "weown-cli"
version = "0.1.0"
description = "WeOwn AI Lite Deployment Manager"
dependencies = [
    "typer",
    "rich",
    "questionary",
    "pydo"
]

[project.scripts]
weown-cli = "weown_cli.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
