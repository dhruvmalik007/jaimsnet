#cloud-config
hostname: ${hostname}

package_update: true
package_upgrade: true

# Install prerequisite tools
packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release

write_files:
  # Docker log rotation — prevent unbounded log growth
  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }

  # Caddy reverse proxy — terminates TLS and proxies to AnythingLLM
  - path: /etc/caddy/Caddyfile
    content: |
      ${fqdn != "" ? fqdn : ":80"} {
        reverse_proxy 127.0.0.1:3001
      }

  # AnythingLLM environment — connects to the centralized jAIMSnet AI Gateway
  - path: /opt/anythingllm/storage/.env
    owner: root:root
    permissions: '0600'
    content: |
      LLM_PROVIDER=generic-openai
      GENERIC_OPENAI_BASE_PATH=${litellm_base_url}/v1
      GENERIC_OPENAI_API_KEY=${litellm_api_key}
      GENERIC_OPENAI_MODEL_PREF=gpt-4o-mini

  # NOTE:Watchtower is conditionally written into docker-compose.yml.
  - path: /opt/anythingllm/docker-compose.yml
    owner: root:root
    permissions: '0644'
    content: |
      services:
        anythingllm:
          image: mintplexlabs/anythingllm:latest
          container_name: anythingllm
          restart: unless-stopped
          ports:
            - "3001:3001"
          volumes:
            - ./storage:/app/server/storage
          deploy:
            resources:
              limits:
                memory: 2g
      %{ if enable_watchtower }
        # Watchtower: watches the anythingllm container and auto-updates it
        # when a new image is pushed to the registry. Polls every 3600 seconds.
        watchtower:
          image: containrrr/watchtower
          container_name: watchtower
          restart: unless-stopped
          volumes:
            - /var/run/docker.sock:/var/run/docker.sock
          command: --interval 3600 anythingllm
      %{ endif }

runcmd:
  # Install Caddy
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | tee /etc/apt/sources.list.d/caddy-stable.list
  - apt-get update
  - apt-get install -y caddy
  - systemctl enable caddy
  - systemctl restart caddy

  # Install Docker using the official repository
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable docker
  - systemctl start docker

  # Deploy AnythingLLM stack
  # cd and docker compose are combined in one shell invocation so the working along with directory is inherited correctly (separate runcmd lines lose cd state).
  - mkdir -p /opt/anythingllm/storage
  - docker rm -f anythingllm watchtower 2>/dev/null || true
  - sh -c 'cd /opt/anythingllm && ${enable_watchtower ? "COMPOSE_PROFILES=watchtower" : ""} 
  - docker compose up -d'

final_message: "WeOwn Lite AI — AnythingLLM provisioned successfully with Watchtower enabled."
