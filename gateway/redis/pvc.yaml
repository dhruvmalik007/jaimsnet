apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: gateway
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
  storageClassName: do-block-storage    # DOKS default block storage class
