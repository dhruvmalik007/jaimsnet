---
# Headless service for StatefulSet stable DNS
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: gateway
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: redis
---
# Regular ClusterIP service for LiteLLM to connect to
# LiteLLM connects to: redis.gateway.svc.cluster.local:6379
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: gateway
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  selector:
    app: redis
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: redis
  type: ClusterIP
