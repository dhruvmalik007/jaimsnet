apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: anythingllm
  namespace: anythingllm
  labels:
    app.kubernetes.io/name: anythingllm
    app.kubernetes.io/component: ui
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # WebSocket support via native NGINX annotations (no configuration-snippet needed)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-set-headers: "anythingllm/custom-headers"
    # Body size for document uploads
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - anythingllm.jaims.app
      secretName: anythingllm-tls
  rules:
    - host: anythingllm.jaims.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: anythingllm
                port:
                  number: 3001
