# Infisical Kubernetes Operator — sync AnythingLLM secrets into anythingllm namespace
# Produces K8s Secret `anythingllm-secrets` with:
#   AUTH_TOKEN        — AnythingLLM admin password token
#   JWT_SECRET        — JWT signing secret for session management
#   DB_PATH           — Full PostgreSQL connection URI (postgresql://user:pw@host:5432/anythingllm)
#   LANGFUSE_PUBLIC_KEY — Langfuse public key
#   LANGFUSE_SECRET_KEY — Langfuse secret key
#   LITELLM_API_KEY   — LiteLLM master key (passed as X-API-KEY)
#
# Prerequisites:
#   1. Infisical operator installed: helm install infisical-operator infisical-helm-charts/secrets-operator
#   2. Machine Identity credential secret created in the anythingllm namespace:
#      kubectl create secret generic infisical-machine-identity \
#        --from-literal=clientId=<INFISICAL_CLIENT_ID> \
#        --from-literal=clientSecret=<INFISICAL_CLIENT_SECRET> \
#        -n anythingllm
#   3. Secrets populated in Infisical under path /gateway/anythingllm (production environment)
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: anythingllm-secrets-sync
  namespace: anythingllm
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 60
  authentication:
    universalAuth:
      credentialsRef:
        name: infisical-machine-identity
        namespace: anythingllm
  managedSecretReference:
    secretName: anythingllm-secrets
    secretNamespace: anythingllm
    creationPolicy: Orphan
  secretsScope:
    projectSlug: jaimsnet
    envSlug: production
    secretsPath: /gateway/anythingllm
    recursive: false
