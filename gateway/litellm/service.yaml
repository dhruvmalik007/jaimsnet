apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: gateway
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/component: gateway
spec:
  selector:
    app: litellm
  ports:
    - name: http
      protocol: TCP
      port: 4000
      targetPort: http
  type: ClusterIP
