# Infisical Kubernetes Operator — InfisicalSecret CRD
# Syncs secrets from Infisical project into a K8s Secret in the `gateway` namespace.
# Prerequisites:
#   1. Infisical operator installed: helm install infisical-operator infisical-helm-charts/secrets-operator
#   2. Machine Identity created in Infisical with Kubernetes Auth enabled.
#   3. Replace INFISICAL_IDENTITY_ID and INFISICAL_PROJECT_SLUG with real values.
#
# Secrets synced into `litellm-secrets`:
#   LITELLM_MASTER_KEY, DATABASE_URL, LANGFUSE_HOST, LANGFUSE_SECRET_KEY,
#   LANGFUSE_PUBLIC_KEY, OPENROUTER_API_KEY, REDIS_PASSWORD
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: litellm-secrets-sync
  namespace: gateway
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 60

  authentication:
    # Kubernetes Machine Identity Auth (recommended for DOKS)
    kubernetesAuth:
      identityId: "INFISICAL_IDENTITY_ID"            # Replace with Infisical Machine Identity ID
      serviceAccountRef:
        name: infisical-service-account
        namespace: infisical

  managedSecretReference:
    secretName: litellm-secrets
    secretNamespace: gateway
    creationPolicy: "Orphan"                          # Keep K8s secret if InfisicalSecret is deleted

  app: "jaimsnet"
  appEnvSlug: "prod"
  projectId: "INFISICAL_PROJECT_ID"                  # Replace with Infisical project ID
