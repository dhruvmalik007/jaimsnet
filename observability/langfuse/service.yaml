apiVersion: v1
kind: Service
metadata:
  name: langfuse
  namespace: observability
  labels:
    app.kubernetes.io/name: langfuse
    app.kubernetes.io/component: observability
spec:
  selector:
    app: langfuse
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: http
  type: ClusterIP
