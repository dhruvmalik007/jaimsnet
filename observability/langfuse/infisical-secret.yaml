# Infisical Kubernetes Operator — sync Langfuse Observability secrets.
# projectId, envSlug and hostAPI are managed centrally in:
#   iac/k8s/infisical-config.yaml (ConfigMap: jaimsnet-infisical-config in infisical ns)
# Do NOT hardcode projectId here. Update the ConfigMap when rotating credentials.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: langfuse-secrets-sync
  namespace: observability
spec:
  hostAPI: https://app.infisical.com
  resyncInterval: 60
  authentication:
    universalAuth:
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
      secretsScope:
        projectSlug: "jaimsnet"
        envSlug: "prod"
        secretsPath: "/observability/langfuse"
  managedSecretReference:
    secretName: langfuse-secrets
    secretNamespace: observability
    creationPolicy: "Orphan"
